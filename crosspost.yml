name: crosspost

# Runs continuously: each run checks X every 30 seconds for about 55 minutes,
# then starts the next run itself. The 30-minute schedule is only a safety net
# in case that chain ever breaks.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Leave EMPTY to start the continuous loop. Or type --dry-run / --backfill 3 for a single check."
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install browser for tweet screenshots
        continue-on-error: true   # if this fails, quote tweets fall back to a text link
        run: python -m playwright install --with-deps chromium

      - name: Decide mode
        env:
          EVENT: ${{ github.event_name }}
          ARGS: ${{ inputs.args }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ -z "$ARGS" ]; then
            echo "LOOP=true" >> "$GITHUB_ENV"
          else
            echo "LOOP=false" >> "$GITHUB_ENV"
          fi
          echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Crosspost
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          CROSSPOST_GIT_PUSH: "1"
          ARGS: ${{ inputs.args }}
        run: |
          if [ "$LOOP" = "true" ]; then
            python crosspost.py --loop 30 --duration 55
          else
            python crosspost.py $ARGS
          fi

      - name: Save state
        if: always()
        run: |
          git config user.name "crosspost-bot"
          git config user.email "crosspost-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            # Move to the newest commit on main but keep our freshly written
            # state.json on disk, so there is never a merge conflict.
            git fetch -q origin main
            git reset -q origin/main
            git add state.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "update state"
            fi
            # GitHub disables scheduled workflows after 60 days without repo activity,
            # so make an empty commit if the last one is over 45 days old.
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
              git commit -q --allow-empty -m "keepalive"
            fi
            git push origin HEAD:main && break
            sleep 5
          done

      # Starts the next 55-minute run right away, so there is no gap.
      # (Skipped when you cancel a run by hand, and when a run dies within 10 minutes.)
      - name: Start the next run
        if: (success() || failure()) && env.LOOP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - START )) -gt 600 ]; then
            gh workflow run crosspost.yml --ref main
          else
            echo "Run ended early, so not restarting. Check the Crosspost step for the error."
          fi
